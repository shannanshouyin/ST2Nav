EXP_NAME: release_r2r_stgasa_mtr
BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]

TRAINER_NAME: SS-ETP-R1
ENV_NAME: R1Env

GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 8
TENSORBOARD_DIR: data/logs/tensorboard_dirs/
CHECKPOINT_FOLDER: data/logs/checkpoints/
RESULTS_DIR: data/logs/checkpoints/
ONLY_LAST_SAVEALL: True
# VIDEO_DIR: data/logs/video/
# VIDEO_OPTION: ["disk"]
# 右侧top-down/topological map的原始栅格分辨率；512为原默认值，建议可试1024/2048/4096。
VIDEO_TOPO_MAP_RESOLUTION: 512
# VIDEO_OPTION开启时，在top-down map中用紫红色持续显示教师轨迹。
VIDEO_DRAW_TEACHER_PATH: False

EVAL:
  USE_CKPT_CONFIG: False
  # SPLIT: train_split_1goal
  SPLIT: val_unseen
  EPISODE_COUNT: -1
  EPISODE_ID: None
  CKPT_PATH_DIR: 'data/logs/checkpoints/ckpt.iter30000.pth'
  fast_eval: False
  ZERO_SHOT_PRETRAIN: False

IL:
  # 原版ETP-R1 DAgger微调；Online MTR由独立开关控制。
  iters: 30000
  log_every: 30000
  checkpoint_every: 30000
  lr: 1e-5
  batch_size: 1 # equal to NUM_ENVIRONMENTS
  ml_weight: 1.0
  expert_policy: spl
  expert_stop_distance: 1.5
  # 仅SFT训练损失；独立于ST-GASA、DPFT时间模块和MTR，不改教师采样或推理。
  RP_DAGGER:
    enabled: False
    lambda_reg: 0.1  # CE + lambda_reg * ghost条件期望代价；MTR开启时另外保留MTR损失。
    tau: 3.0  # 米；R2R使用到终点的距离差。STOP仍只用原CE监督。

  st_gasa_lr: 1e-5
  sap_lr: 1e-5
  mtr_lr: 1e-5
  # 独立开关：False时不采样relation mask、不运行MTR Head、不计算MTR loss。
  # stgasa=False时可训练birth/obs辅助任务；此模式需MTR.spatial_recovery=False、eval_predict=False。
  use_online_mtr: True
  # 固定遮蔽有效无序节点对的比例；仅替换关系矩阵位置，不清零节点特征。
  # 空间预测分支仍隐藏全部真实拓扑，不因该比例而暴露剩余边。
  mtr_mask_ratio: 0.15
  mtr_loss_weight: 0.1
  mtr_birth_loss_weight: 1.0
  mtr_observation_loss_weight: 1.0
  mtr_distance_loss_weight: 0.1
  mtr_edge_loss_weight: 0.1
  # 显式控制DAgger可训练模块；RGB/Depth编码器和航点预测器始终冻结。
  TRAINABLE:
    # 恢复原版ETP-R1式完整VLN-BERT微调；仅RGB/Depth backbone和Waypoint Predictor冻结。
    language_embeddings: True
    language_encoder: True
    # RGB/Depth特征投影、位置/导航类型编码和pano transformer；不包含冻结的视觉主干。
    panorama_embeddings: True
    # 图节点 step/position/task embedding。
    global_map_embeddings: True
    # global encoder中的图-文cross-modal规划层。
    global_encoder_x_layers: True
    # SAP打分前，让每个图节点从指令token中查询相关文本信息。
    graph_query_text: True
    # 节点时间Query残差；使用IL.lr，不新增独立学习率。
    graph_attentioned_txt: True
    # 最终global SAP动作打分头。
    global_sap_head: True
    # ST-GASA固定时间关系参数。
    stgasa: False
    # Online MTR全部模块：上下文、时间分类与距离恢复头。
    mtr: True

  sample_ratio: 0.75
  decay_interval: 2000
  warmup_iters: 500
  min_lr_ratio: 1.0

  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: True

  ghost_aug: 0.0
  back_algo: control
  tryout: True
  # False 从 MODEL.pretrained_path 开始；True 从在线微调 checkpoint 续训。
  load_from_ckpt: False
  ckpt_to_load: "data/logs/checkpoints/ckpt.iter3500.pth"
  is_requeue: False

MODEL:
  task_type: r2r
  policy_name: R1Policy

  NUM_ANGLES: 12
  pretrained_path: pretrained/r2r_rxr_ce/mlm.sap_habitat_depth/store2/model_step_367500.pt
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True

  stgasa: False
  # 复用STGASA.time_max_bucket和relation_hidden_size，两套Embedding不共享权重。
  # alpha零初始化；G_query = G + tanh(alpha) * LN(E_time)。
  STGASA:
    # 当前固定ST-GASA只使用birth delta、last-observation delta和9类有向类型对。
    # Instruction Gate、age、空间分桶已按最终方案移除；gamma在代码中固定零初始化。
    relation_hidden_size: 128
    time_max_bucket: 6
    # 仅eval/inference覆盖每层每head的原始gamma；null保留checkpoint，0.0关闭时间偏置。
    eval_gamma: null
  mtr: True
  MTR:
    relation_hidden_size: 256
    spatial_recovery: False  # 隐藏全部拓扑，视觉+XYZ预测边，再计算预测图最短距离。
    # 仅eval/inference：先预测选中关系，再运行一次ST-GASA/SAP，不计算MTR损失。
    eval_predict: False
    # 确定性选择有效无序关系对；空间恢复开启时也替换选中距离。
    eval_mask_ratio: 0.15

  merge_ghost: True
  consume_ghost: True

  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True
